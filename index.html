
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142b55">
<title>SUDIP INDUSTRY | Online Shopping</title>
<style>
:root{--blue:#173b75;--blue2:#2458a6;--bg:#f3f6fb;--white:#fff;--text:#172033;--muted:#68758a;--line:#e4e9f1;--green:#13865c;--red:#d43d4e;--shadow:0 5px 22px #172b4d12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Bengali",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
a{color:inherit;text-decoration:none}
header{background:var(--blue);color:white;position:sticky;top:0;z-index:10;box-shadow:var(--shadow)}
.top{max-width:1200px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.logo{font-size:20px;font-weight:900;letter-spacing:.5px;white-space:nowrap}
.logo small{display:block;font-size:9px;letter-spacing:2px;color:#cbd9f1;margin-top:3px}
.search{flex:1;display:flex;background:white;border-radius:9px;overflow:hidden}
.search input{width:100%;border:0;padding:12px;outline:0;color:#172033}
.search button{background:#f4b942;color:#172033;padding:0 17px;font-weight:bold}
.head-actions{display:flex;gap:8px;align-items:center}
.head-actions button{background:#ffffff18;color:white;padding:10px;border-radius:8px}
#userLabel{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{max-width:1200px;margin:auto;padding:0 16px 10px;display:flex;gap:8px;overflow:auto}
nav button{background:transparent;color:#e7eefb;padding:7px 12px;border-radius:20px;white-space:nowrap}
nav button:hover,nav button.active{background:#ffffff24}
main{max-width:1200px;margin:20px auto;padding:0 16px 85px}
.hero{background:linear-gradient(115deg,#102b58,#2863b3);color:white;border-radius:18px;padding:30px;display:flex;align-items:center;justify-content:space-between;gap:20px;overflow:hidden;min-height:190px}
.hero h1{font-size:clamp(25px,5vw,42px);margin:0 0 10px}
.hero p{color:#dce8ff;margin:0 0 18px}
.primary{background:#f4b942;color:#172033;padding:11px 18px;border-radius:8px;font-weight:800}
.hero-art{font-size:80px;opacity:.9}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 0 14px}
.section-head h2{font-size:21px;margin:0}
.muted{color:var(--muted);font-size:13px}
.categories{display:flex;gap:10px;overflow:auto;padding-bottom:4px}
.cat{background:white;border:1px solid var(--line);border-radius:12px;padding:13px 17px;min-width:100px;text-align:center;font-weight:700;color:var(--blue)}
.cat span{display:block;font-size:25px;margin-bottom:6px}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow);min-width:0}
.product-img{height:190px;background:#f8f9fc;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.product-img img{width:100%;height:100%;object-fit:contain}
.heart{position:absolute;right:9px;top:9px;background:white;border-radius:50%;width:34px;height:34px;color:#d43d4e;font-size:19px;box-shadow:var(--shadow)}
.product-info{padding:12px}
.product-info h3{font-size:15px;margin:0 0 8px;min-height:36px;line-height:1.35}
.price{font-weight:900;font-size:18px;color:var(--blue)}
.mrp{font-size:12px;color:#8992a1;text-decoration:line-through;margin-left:6px}
.product-info p{font-size:12px;color:var(--muted);margin:7px 0}
.card-actions{display:flex;gap:7px;margin-top:10px}
.card-actions button{flex:1;padding:9px 5px;border-radius:7px;font-size:12px;font-weight:700}
.add{background:var(--blue);color:white}.view{background:#edf2fa;color:var(--blue)}
.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.panel h2,.panel h3{margin-top:0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:700}
.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #dce2ec;border-radius:8px;outline-color:var(--blue)}
.field textarea{min-height:75px;resize:vertical}
.action{background:var(--blue);color:white;padding:11px 16px;border-radius:8px;font-weight:700}
.danger{background:#fff0f1;color:var(--red);padding:8px 11px;border-radius:7px}
.soft{background:#edf2fa;color:var(--blue);padding:9px 12px;border-radius:7px;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.item-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item-row img{width:70px;height:70px;object-fit:contain;background:#f6f7fa;border-radius:8px}
.item-row .grow{flex:1;min-width:0}
.item-row h3{font-size:14px;margin:0 0 5px}
.qty{display:flex;align-items:center;gap:9px}
.qty button{background:#edf2fa;color:var(--blue);width:28px;height:28px;border-radius:6px}
.empty{text-align:center;padding:35px 15px;color:var(--muted)}
.profile{display:flex;align-items:center;gap:14px}
.profile img{width:65px;height:65px;border-radius:50%;object-fit:cover;background:#edf2fa}
.badge{font-size:11px;background:#e8f5ef;color:var(--green);padding:4px 8px;border-radius:20px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f5f7fb}
footer{text-align:center;padding:25px 16px;background:#10264b;color:#d9e3f5;font-size:13px}
footer a{color:white;text-decoration:underline}
.bottom{display:none}
.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:12px 18px;border-radius:9px;z-index:30;box-shadow:var(--shadow);max-width:90%;text-align:center}
.hidden{display:none!important}
@media(max-width:800px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}.product-img{height:160px}.top{gap:9px}.logo{font-size:16px}.head-actions button{padding:9px 7px}}
@media(max-width:560px){main{margin:12px auto;padding:0 11px 90px}.top{flex-wrap:wrap;padding:10px}.logo{flex:1}.search{order:3;flex-basis:100%}.head-actions{gap:5px}.head-actions button{font-size:12px}.hero{padding:22px;min-height:165px}.hero-art{font-size:55px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product-img{height:145px}.product-info{padding:9px}.product-info h3{font-size:13px}.price{font-size:16px}.card-actions button{font-size:11px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);z-index:15;justify-content:space-around;padding:8px 2px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px #172b4d12}.bottom button{background:transparent;color:#536078;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}.bottom b{font-size:19px}.bottom button.active{color:var(--blue)}table{min-width:570px}.table-wrap{overflow:auto}}
</style>
</head>
<body>
<header>
 <div class="top">
  <a class="logo" href="#home">SUDIP INDUSTRY<small>DREAM • WORK • SUCCESS</small></a>
  <div class="search"><input id="searchInput" placeholder="Search products..." oninput="searchProducts(this.value)"><button onclick="searchProducts(document.getElementById('searchInput').value)">Search</button></div>

  <button onclick="go('contact')" data-page="contact">Contact</button>

 </nav>
</header>
<main id="app"><div class="panel">Loading SUDIP INDUSTRY...</div></main>

 <button onclick="go('home')" data-page="home"><b>⌂</b>Home</button>
 <button onclick="go('shop')" data-page="shop"><b>▦</b>Shop</button>
 <button onclick="go('wishlist')" data-page="wishlist"><b>♡</b>Wishlist</button>
 <button onclick="go('cart')" data-page="cart"><b>🛒</b>Cart</button>
 <button onclick="go('profile')" data-page="profile"><b>♙</b>Profile</button>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import{getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signOut,signInAnonymously,linkWithPopup}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import{getFirestore,collection,addDoc,getDocs,getDoc,doc,updateDoc,deleteDoc,setDoc,query,where,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyANbPXxpxMNibsWpJ6fqb71fGOADbdMVzk",
 authDomain:"sudip-industry.firebaseapp.com",
 projectId:"sudip-industry",
 storageBucket:"sudip-industry.firebasestorage.app",
 messagingSenderId:"377224435101",
 appId:"1:377224435101:web:c5e152120dec1664070b74"
};
const ADMIN_EMAIL="sudippramanick66@gmail.com";
const BUSINESS_EMAIL="sudippramanick66@gmail.com";
const BUSINESS_PHONE="+91 89819 88831";
const WHATSAPP_NUMBER="918981988831";

const appFirebase=initializeApp(firebaseConfig);
const auth=getAuth(appFirebase);
const db=getFirestore(appFirebase);
const provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});

let user=null,products=[],orders=[],wishlist=[],currentPage="home",searchTerm="",selectedProduct=null;
let cart=JSON.parse(localStorage.getItem("sudip_cart_v1")||"[]");
const $=s=>document.querySelector(s);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isAdmin=()=>!!user&&user.email===ADMIN_EMAIL&&!user.isAnonymous;
const imgSrc=p=>p.image||"";
function toast(t){const el=$("#toast");el.textContent=t;el.classList.remove("hidden");setTimeout(()=>el.classList.add("hidden"),2500)}
function saveCart(){localStorage.setItem("sudip_cart_v1",JSON.stringify(cart));counts()}
function counts(){$("#cartCount").textContent=cart.reduce((a,x)=>a+x.qty,0);$("#wishCount").textContent=wishlist.length}
function setPage(p){currentPage=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p))}
function go(p){location.hash=p}
window.go=go;

async function loadProducts(){
 try{const snap=await getDocs(collection(db,"products"));products=snap.docs.map(d=>({id:d.id,...d.data()}));}
 catch(e){console.error(e);toast("Products load হয়নি। Firebase Rules পরীক্ষা করুন।");}
}
async function loadWishlist(){
 wishlist=[];
 if(!user||user.isAnonymous){counts();return;}
 try{const s=await getDocs(collection(db,"users",user.uid,"wishlist"));wishlist=s.docs.map(d=>d.id);}
 catch(e){console.warn(e);}
 counts();
}
async function loadOrders(){
 orders=[];
 if(!user||user.isAnonymous)return;
 try{
  const q=isAdmin()?collection(db,"orders"):query(collection(db,"orders"),where("ownerUid","==",user.uid));
  const s=await getDocs(q);orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
 }catch(e){console.warn(e);}
}
async function refresh(){await loadProducts();await loadWishlist();await loadOrders();render();}
onAuthStateChanged(auth,async u=>{
 user=u;
 if(!u){try{await signInAnonymously(auth);}catch(e){console.error(e);render();}}
 else{await refresh();}
 updateUserLabel();
});
function updateUserLabel(){$("#userLabel").textContent=user&&!user.isAnonymous?(user.displayName||user.email||"Account"):"Login";}
async function googleLogin(){
 try{
  if(user?.isAnonymous){try{await linkWithPopup(user,provider);toast("Google account connected");}
   catch(e){if(e.code==="auth/credential-already-in-use"||e.code==="auth/email-already-in-use"){await signOut(auth);await signInWithPopup(auth,provider);}else throw e;}
  }else{await signInWithPopup(auth,provider);}
 }catch(e){toast("Login failed: "+(e.message||e.code));}
}
async function switchAccount(){try{await signOut(auth);await signInWithPopup(auth,provider);}catch(e){toast("Account switch হয়নি: "+e.message);}}
async function logout(){try{await signOut(auth);toast("Logged out");}catch(e){toast(e.message);}}
window.googleLogin=googleLogin;window.switchAccount=switchAccount;window.logout=logout;

function productCard(p){
 const liked=wishlist.includes(p.id);
 return `<article class="card">
 <div class="product-img">${p.image?`<img src="${safe(p.image)}" alt="${safe(p.name)}" loading="lazy" onerror="this.style.display='none'">`:"<span style='font-size:45px'>🛍️</span>"}
 <button class="heart" onclick="toggleWish('${p.id}')" title="Wishlist">${liked?"♥":"♡"}</button></div>
 <div class="product-info"><h3>${safe(p.name||"Product")}</h3>
 <div><span class="price">${money(p.price)}</span>${p.mrp?`<span class="mrp">${money(p.mrp)}</span>`:""}</div>
 <p>${safe(p.category||"General")}</p>
 <div class="card-actions"><button class="view" onclick="showProduct('${p.id}')">Details</button><button class="add" onclick="addCart('${p.id}')">Add to Cart</button></div>
 </div></article>`;
}
function homeView(){
 const featured=products.filter(p=>p.popularity==="Popular"||p.popular===true).slice(0,8);
 return `<section class="hero"><div><h1>Welcome to SUDIP INDUSTRY</h1><p>Shop smart. Shop with confidence.</p><button class="primary" onclick="go('shop')">Explore Products →</button></div><div class="hero-art">🛍️</div></section>
 <div class="section-head"><h2>Shop by Category</h2></div>
 <div class="categories">${["All","Fashion","Electronics","Home","Beauty","Other"].map((c,i)=>`<button class="cat" onclick="filterCategory('${c}')"><span>${["🛍️","👕","📱","🏠","✨","🎁"][i]}</span>${c}</button>`).join("")}</div>
 <div class="section-head"><h2>Featured Products</h2><button class="soft" onclick="go('shop')">View all →</button></div>
 <div class="products">${(featured.length?featured:products.slice(0,8)).map(productCard).join("")||empty("এখনও কোনো পণ্য যোগ করা হয়নি।")}</div>`;
}
function empty(t){return `<div class="empty">${t}</div>`}
function shopView(){
 const list=products.filter(p=>(!searchTerm||(p.name||"").toLowerCase().includes(searchTerm)||(p.category||"").toLowerCase().includes(searchTerm))&&(!window.activeCategory||window.activeCategory==="All"||p.category===window.activeCategory));
 return `<div class="section-head"><h2>All Products</h2><span class="muted">${list.length} products</span></div><div class="products">${list.map(productCard).join("")||empty("কোনো পণ্য পাওয়া যায়নি।")}</div>`;
}
window.searchProducts=v=>{searchTerm=v.trim().toLowerCase();if(currentPage!=="shop")go("shop");else render();};
window.filterCategory=c=>{window.activeCategory=c;go("shop");};
window.showProduct=id=>{selectedProduct=id;go("product");};
function productView(){
 const p=products.find(x=>x.id===selectedProduct);
 if(!p)return empty("Product পাওয়া যায়নি।");
 return `<div class="panel"><button class="soft" onclick="go('shop')">← Back to Shop</button><div class="row" style="align-items:flex-start;margin-top:18px"><div style="flex:1;min-width:220px;text-align:center;background:#f7f8fb;border-radius:12px;padding:15px">${p.image?`<img src="${safe(p.image)}" style="max-width:100%;height:260px;object-fit:contain">`:"🛍️"}</div><div style="flex:1;min-width:220px"><h2>${safe(p.name)}</h2><div class="price" style="font-size:25px">${money(p.price)}</div>${p.mrp?`<p class="mrp">${money(p.mrp)}</p>`:""}<p>${safe(p.description||"")}</p><p class="muted">Category: ${safe(p.category||"General")}</p><button class="action" onclick="addCart('${p.id}')">Add to Cart</button> <button class="soft" onclick="toggleWish('${p.id}')">♡ Wishlist</button></div></div></div>`;
}
window.addCart=id=>{const p=products.find(x=>x.id===id);if(!p)return;const old=cart.find(x=>x.id===id);if(old)old.qty++;else cart.push({id,qty:1});saveCart();toast("Cart-এ যোগ হয়েছে");};
window.toggleWish=async id=>{
 if(!user||user.isAnonymous){toast("Wishlist ব্যবহার করতে Google Login করুন");go("profile");return;}
 try{
  const ref=doc(db,"users",user.uid,"wishlist",id);
  if(wishlist.includes(id)){await deleteDoc(ref);wishlist=wishlist.filter(x=>x!==id);}
  else{await setDoc(ref,{createdAt:serverTimestamp()});wishlist.push(id);}
  counts();render();
 }catch(e){toast("Wishlist update হয়নি: "+e.message);}
};
function cartView(){
 const lines=cart.map(x=>({...x,p:products.find(p=>p.id===x.id)})).filter(x=>x.p);
 const total=lines.reduce((s,x)=>s+Number(x.p.price||0)*x.qty,0);
 return `<div class="section-head"><h2>Shopping Cart</h2></div><div class="panel">${lines.map(x=>`<div class="item-row"><img src="${safe(imgSrc(x.p))}" onerror="this.style.display='none'"><div class="grow"><h3>${safe(x.p.name)}</h3><b>${money(x.p.price)}</b><div class="qty"><button onclick="changeQty('${x.id}',-1)">−</button>${x.qty}<button onclick="changeQty('${x.id}',1)">+</button><button class="danger" onclick="removeCart('${x.id}')">Remove</button></div></div></div>`).join("")||empty("তোমার Cart খালি।")}
 ${lines.length?`<div class="row" style="margin-top:18px"><b>Total: ${money(total)}</b><button class="action" onclick="go('checkout')">Proceed to Checkout</button></div>`:""}</div>`;
}
window.changeQty=(id,n)=>{const x=cart.find(a=>a.id===id);if(x){x.qty+=n;if(x.qty<1)cart=cart.filter(a=>a.id!==id);saveCart();render();}};
window.removeCart=id=>{cart=cart.filter(x=>x.id!==id);saveCart();render();};
function checkoutView(){
 const lines=cart.map(x=>({...x,p:products.find(p=>p.id===x.id)})).filter(x=>x.p);
 const total=lines.reduce((s,x)=>s+Number(x.p.price||0)*x.qty,0);
 if(!lines.length)return empty("Checkout করার আগে Cart-এ Product যোগ করো।");
 return `<div class="section-head"><h2>Checkout — Cash on Delivery</h2></div><div class="panel"><p class="badge">Cash on Delivery available</p><form id="checkoutForm" class="form-grid">
 <div class="field"><label>Full Name *</label><input name="name" required maxlength="80"></div>
 <div class="field"><label>Mobile Number *</label><input name="phone" required pattern="[6-9][0-9]{9}" maxlength="10" inputmode="numeric"></div>
 <div class="field full"><label>Full Delivery Address *</label><textarea name="address" required minlength="10" maxlength="500"></textarea></div>
 <div class="field"><label>City / Town *</label><input name="city" required></div>
 <div class="field"><label>PIN Code *</label><input name="pin" required pattern="[0-9]{6}" maxlength="6" inputmode="numeric"></div>
 <div class="field full"><label>Order Summary</label><b>${lines.map(x=>`${safe(x.p.name)} × ${x.qty}`).join("<br>")}</b><h2>Total: ${money(total)}</h2></div>
 <div class="field full"><button class="action" type="submit">Place COD Order</button></div></form></div>`;
}
$("#app").addEventListener("submit",async e=>{
 if(e.target.id!=="checkoutForm")return;e.preventDefault();
 if(!user||user.isAnonymous){toast("Order করতে Google Login প্রয়োজন");go("profile");return;}
 const f=new FormData(e.target),lines=cart.map(x=>({...x,p:products.find(p=>p.id===x.id)})).filter(x=>x.p);
 if(!lines.length)return;
 const total=lines.reduce((s,x)=>s+Number(x.p.price||0)*x.qty,0);
 const btn=e.target.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Placing
