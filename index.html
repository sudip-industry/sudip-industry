<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173b75">
<meta name="description" content="SUDIP INDUSTRY - DREAM WORK SUCCESS">
<title>SUDIP INDUSTRY</title>

<style>
:root{
  --blue:#173b75;
  --gold:#f4b942;
  --bg:#f3f6fb;
  --white:#fff;
  --text:#172033;
  --line:#e5eaf2
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
body{touch-action:pan-y}
button,input,select,textarea{font:inherit;touch-action:manipulation;pointer-events:auto}
button{border:0;border-radius:9px;padding:11px 15px;background:var(--blue);color:white;cursor:pointer;margin:3px;min-height:42px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;margin:6px 0 12px;background:white;color:var(--text)}
header{background:var(--blue);color:white;padding:14px;position:sticky;top:0;z-index:100}
.header{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:21px;font-weight:bold}
.search{flex:1;min-width:150px}
.search input{margin:0}
nav{display:flex;gap:7px;flex-wrap:wrap;max-width:1100px;margin:12px auto 0}
nav button{background:#ffffff20}
main{max-width:1100px;margin:18px auto;padding:0 12px 110px}
.hero{background:linear-gradient(120deg,#173b75,#2865b5);color:white;padding:35px 20px;border-radius:15px;margin-bottom:20px}
.hero h1{font-size:27px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:13px}
.card{background:white;border:1px solid var(--line);border-radius:12px;padding:12px;overflow:hidden}
.card img{width:100%;height:145px;object-fit:contain;border-radius:8px;background:#f7f8fa}
.card h3{font-size:15px}
.price{font-weight:bold;color:var(--blue)}
.page{display:none;pointer-events:auto}
.page.active{display:block}
.panel{background:white;padding:16px;border-radius:12px;margin-bottom:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.small{font-size:12px;color:#64748b}
.hidden{display:none!important}
footer{text-align:center;padding:22px;background:white}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:1000}
.bottom-nav button{background:white;color:var(--blue);padding:7px 5px;font-size:12px;flex:1;min-height:44px}
#toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:12px 18px;border-radius:9px;z-index:2000;display:none;max-width:90%;text-align:center;pointer-events:none}
.product-gallery{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.product-gallery img{width:65px;height:65px;object-fit:contain;border:1px solid var(--line);border-radius:7px;cursor:pointer}
.admin-card{background:#fff;padding:14px;border-radius:10px;margin-bottom:12px;border:1px solid var(--line);overflow-wrap:anywhere}
.order-filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
.order-filters button{flex:1;min-width:105px}
.delete-btn{background:#dc2626}
.category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:12px;margin:12px 0 22px}
.category-card{background:white;border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center;cursor:pointer;min-width:0}
.category-card img{width:100%;height:105px;object-fit:cover;border-radius:8px;background:#f1f5f9;pointer-events:none}
.category-card b{display:block;margin-top:8px;font-size:14px;overflow-wrap:anywhere;pointer-events:none}
.category-card.selected{border:2px solid var(--blue)}
.category-admin-img{width:90px;height:75px;object-fit:cover;border-radius:8px}
.preview-img{width:100px;height:100px;object-fit:cover;border-radius:9px;display:none;margin:5px 0}
.remark-box{background:#fff7e6;border-left:4px solid var(--gold);padding:10px;border-radius:6px;margin:10px 0}
@media(min-width:700px){.bottom-nav{display:none}}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">SUDIP INDUSTRY</div>
    <div class="search">
      <input id="searchInput" placeholder="Search products..." oninput="renderShop()">
    </div>
    <select id="languageSelect" onchange="changeLanguage(this.value)" style="width:auto;margin:0">
      <option value="en">English</option>
      <option value="bn">বাংলা</option>
      <option value="hi">हिन्दी</option>
      <option value="ne">नेपाली</option>
      <option value="ml">മലയാളം</option>
    </select>
  </div>

  <nav>
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('shop')">Shop</button>
    <button onclick="showPage('wishlist')">Wishlist</button>
    <button onclick="showPage('cart')">Cart (<span id="cartCount">0</span>)</button>
    <button onclick="showPage('orders')">My Orders</button>
    <button onclick="showPage('profile')">Account</button>
    <button onclick="showPage('admin')">Admin</button>
  </nav>
</header>

<main>

<section id="home" class="page active">
  <div class="hero">
    <h1 id="heroTitle">Welcome to SUDIP INDUSTRY</h1>
    <p>DREAM • WORK • SUCCESS</p>
    <p id="heroText">Shop your favourite products easily.</p>
    <button onclick="showPage('shop')" id="shopNowButton" style="background:#f4b942;color:#172033">Shop Now</button>
  </div>

  <h2>Shop by Category</h2>
  <div id="homeCategories" class="category-grid"></div>

  <h2>Featured Products</h2>
  <div id="homeProducts" class="grid"></div>
</section>

<section id="shop" class="page">
  <h2>All Products</h2>
  <h3>Categories</h3>
  <div id="shopCategories" class="category-grid"></div>
  <button onclick="clearCategoryFilter()">All Products</button>
  <p id="activeCategoryLabel"></p>

  <select id="sortProducts" onchange="renderShop()">
    <option value="latest">Latest</option>
    <option value="low">Price: Low to High</option>
    <option value="high">Price: High to Low</option>
  </select>

  <div id="shopProducts" class="grid"></div>
</section>

<section id="detailPage" class="page">
  <div id="productDetail" class="panel"></div>
</section>

<section id="wishlist" class="page">
  <h2>Wishlist</h2>
  <div id="wishlistContent" class="grid"></div>
</section>

<section id="cart" class="page">
  <h2>Shopping Cart</h2>
  <div id="cartContent"></div>
</section>

<section id="checkout" class="page">
  <h2>Checkout</h2>
  <div class="panel">
    <form id="checkoutForm" onsubmit="placeOrder(event)">
      <label>Your Name</label>
      <input id="customerName" required maxlength="100">

      <label>Mobile Number</label>
