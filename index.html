<style>

.hero h1{font-size:clamp(24px,5vw,40px);margin:0 0 10px}.hero p{color:#dce8ff}.hero-art{font-size:70px}
.section{display:flex;justify-content:space-between;align-items:center;margin:24px 0 13px;gap:10px}.section h2{font-size:21px;margin:0}

.info p{font-size:12px;color:var(--muted)}.actions{display:flex;gap:6px;margin-top:10px}.actions button{flex:1;padding:9px 4px;border-radius:7px;font-size:12px;font-weight:bold}.primary{background:var(--blue);color:white;padding:11px 16px;border-radius:8px;font-weight:bold}.soft{background:#edf2fa;color:var(--blue);padding:9px 12px;border-radius:7px;font-weight:bold}.gold{background:var(--gold);color:#172033;padding:11px 16px;border-radius:8px;font-weight:bold}.danger{background:#fff0f1;color:#c33345;padding:8px 11px;border-radius:7px}

.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.item img{width:65px;height:65px;object-fit:contain;background:#f7f8fb;border-radius:8px}.grow{flex:1;min-width:0}.item h3{font-size:14px;margin:0 0 5px}.qty{display:flex;gap:8px;align-items:center;margin-top:7px}.qty button{background:#edf2fa;color:var(--blue);padding:5px 10px;border-radius:5px}
.badge{display:inline-block;background:#e8f5ef;color:#13865c;padding:5px 9px;border-radius:20px;font-size:12px}
.paybox{background:#f3f6fb;border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}.paybox p{margin:7px 0;overflow-wrap:anywhere}.payvalue{font-weight:bold;color:var(--blue);user-select:text}
.profile{display:flex;align-items:center;gap:13px}.profile img{width:62px;height:62px;border-radius:50%;object-fit:cover;background:#eee}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:550px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{background:#f5f7fb}

@media(max-width:800px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}.product-img{height:155px}}
@media(max-width:560px){.top{flex-wrap:wrap;padding:10px}.logo{flex:1;font-size:16px}.search{order:3;flex-basis:100%}.headbtn{padding:8px 6px;font-size:12px}main{padding:0 10px 90px;margin:12px auto}.hero{padding:20px;min-height:155px}.hero-art{font-size:48px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product-img{height:140px}.info{padding:9px}.info h3{font-size:13px}.actions button{font-size:11px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);justify-content:space-around;padding:8px 2px calc(8px + env(safe-area-inset-bottom));z-index:15}.bottom button{background:none;color:#536078;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}.bottom b{font-size:19px}}
</style>

 }

window.googleLogin=googleLogin;window.switchAccount=switchAccount;window.logout=logout;

function card(p){return `<div class="card"><div class="product-img">${p.image?`<img src="${safe(p.image)}" alt="${safe(p.name)}">`:"🛍️"}<button class="heart" onclick="toggleWish('${p.id}')">${wishlist.includes(p.id)?"♥":"♡"}</button></div><div class="info"><h3>${safe(p.name)}</h3><span class="price">${money(p.price)}</span>${p.mrp?`<span class="mrp">${money(p.mrp)}</span>`:""}<p>${safe(p.category||"Other")}</p><div class="actions"><button class="soft" onclick="showProduct('${p.id}')">Details</button><button class="primary" onclick="addCart('${p.id}')">Add to Cart</button></div></div></div>`}

 if(e.target.id==="checkoutForm"){
