<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const CATS=[['electronics','Electronics','🎧'],['fashion','Fashion','👕'],['home','Home & Kitchen','🍳'],['beauty','Beauty & Personal Care','🧴'],['accessories','Accessories','⌚']];
const cn=k=>(CATS.find(c=>c[0]==k)||[0,k])[1];
const SEED=[
['p1','Sample Wireless Earbuds','electronics',1299,1999,25,90,'🎧',220],['p2','Sample Smart Watch','electronics',2499,3999,12,80,'⌚',250],
['p3','Sample Cotton T-Shirt','fashion',499,799,40,70,'👕',200],['p4','Sample Denim Jacket','fashion',1799,2599,8,50,'🧥',210],
['p5','Sample Non-Stick Pan','home',899,1299,30,60,'🍳',30],['p6','Sample Water Bottle','home',349,499,60,85,'🍶',190],
['p7','Sample Face Wash','beauty',249,349,50,75,'🧴',160],['p8','Sample Beard Trimmer','beauty',999,1499,18,65,'💈',270],
['p9','Sample Laptop Backpack','accessories',1199,1799,22,88,'🎒',230],['p10','Sample Sunglasses','accessories',599,999,0,40,'🕶️',240]
].map(a=>({id:a[0],name:a[1],cat:a[2],price:a[3],mrp:a[4],stock:a[5],pop:a[6],icon:a[7],hue:a[8],sample:1,desc:'Placeholder product for layout only. Replace this item from the Admin dashboard with your real product details.'}));
let products=SEED.slice(),db=null,dbOn=false,isAdmin=false,uid=null,curUser=null,orders=[],msgs=[],settings={whatsapp:''},aTab='products',F={q:'',c:'',p:'',s:''},editId=null;
let cart={};try{cart=JSON.parse(localStorage.getItem('si_cart')||'{}')}catch(e){}
const saveCart=()=>{try{localStorage.setItem('si_cart',JSON.stringify(cart))}catch(e){}$('#cc').textContent=Object.values(cart).reduce((a,b)=>a+b,0)};
const P=id=>products.find(p=>p.id==id);
const bg=p=>`background:linear-gradient(135deg,hsl(${p.hue||220} 70% 92%),hsl(${p.hue||220} 60% 80%))`;
const disc=p=>p.mrp>p.price?Math.round((1-p.price/p.mrp)*100):0;
const items=()=>Object.keys(cart).map(id=>({p:P(id),q:cart[id]})).filter(x=>x.p);
const total=()=>items().reduce((a,x)=>a+x.p.price*x.q,0);
function card(p){return `<div class="pc"><a class="pi" href="#product-${esc(p.id)}" style="${bg(p)}">${disc(p)?`<span class="off">${disc(p)}% OFF</span>`:''}${p.sample?'<span class="smp">SAMPLE</span>':''}${esc(p.icon||'📦')}</a><div class="pb"><a href="#product-${esc(p.id)}">${esc(p.name)}</a><div class="mut">${esc(cn(p.cat))}</div><div class="pr"><b>${inr(p.price)}</b>${disc(p)?`<s>${inr(p.mrp)}</s>`:''}</div><button class="btn s" ${p.stock>0?'':'disabled'} onclick="add('${esc(p.id)}')">${p.stock>0?'Add to Cart':'Out of Stock'}</button></div></div>`}
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0b0f19;color:#fff;padding:10px 18px;border-radius:10px;z-index:50';document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function add(id,go){const p=P(id);if(!p||p.stock<1)return;cart[id]=Math.min((cart[id]||0)+1,p.stock);saveCart();go?location.hash='checkout':toast('Added to cart')}
function qty(id,d){const p=P(id);cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];else if(p&&cart[id]>p.stock)cart[id]=p.stock;saveCart();route()}
function rm(id){delete cart[id];saveCart();route()}
const POL={privacy:['Privacy Policy','We collect only the details you give us (name, mobile number, delivery address, email) to process and deliver your order and to reply to your queries. We do not sell your personal information. You may contact us at sudippramanick66@gmail.com to request correction or deletion of your data.'],
terms:['Terms & Conditions','By placing an order you confirm that the details you provide are correct. Prices and availability may change without notice. An order is accepted only after SUDIP INDUSTRY confirms it with you. We may cancel an order if a product is unavailable or details are incorrect.'],
shipping:['Shipping Policy','We deliver across India. Delivery charges and estimated delivery times will be confirmed when your order is accepted. Please keep your mobile reachable for delivery coordination. Cash on Delivery is the available payment method at this time.'],
returns:['Return & Refund Policy','If you receive a damaged, defective or wrong item, contact us at sudippramanick66@gmail.com soon after delivery with your order reference. Eligible returns and refunds will be handled after we review the request. Final return window and conditions will be published here by the business owner.']};
function route(){
 const h=location.hash.slice(1)||'home',[k,...r]=h.split('-'),a=r.join('-');scrollTo(0,0);$('#nl').classList.remove('o');
 let v;
 if(k=='home')v=home();else if(k=='shop')v=shop(a);else if(k=='product')v=prod(a);else if(k=='cart')v=cartV();else if(k=='checkout')v=checkout();else if(k=='orders')v=myOrders();else if(k=='done')v=done(a);
 else if(k=='contact')v=contact();else if(k=='about')v=about();else if(k=='policy'&&POL[a])v=`<div class="w sec"><h1>${POL[a][0]}</h1><p>${POL[a][1]}</p><div class="note">Draft policy text. Please review and complete it (business address, timelines, legal details) before accepting live orders.</div></div>`;
 else if(k=='admin')v=admin();else v=home();
 app.innerHTML=v;if(k=='shop')shopInit();if(k=='checkout')$('#cf')&&($('#cf').onsubmit=placeOrder);if(k=='contact')$('#mf').onsubmit=sendMsg}
function home(){return `<section class="hero"><div class="w"><div class="tag">DREAM • WORK • SUCCESS</div><h1>Welcome to SUDIP INDUSTRY</h1><p>Quality products for everyday life, delivered across India.</p><a class="btn" href="#shop">Shop Now</a></div></section>
<div class="w sec"><h2>Popular Categories</h2><div class="grid">${CATS.map(c=>`<a class="cat" href="#shop-${c[0]}"><span>${c[2]}</span>${c[1]}</a>`).join('')}</div></div>
<div class="w sec"><h2>Featured Products</h2><div class="grid">${products.filter(p=>p.active!==false).sort((a,b)=>b.pop-a.pop).slice(0,8).map(card).join('')}</div></div>
<div class="w sec"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))"><div class="box"><b>🚚 Delivery across India</b><div class="mut">Details confirmed at order time.</div></div><div class="box"><b>💵 Cash on Delivery</b><div class="mut">Pay when your order arrives.</div></div><div class="box"><b>💬 Customer support</b><div class="mut">Email or WhatsApp us.</div></div></div></div>`}
function shop(c){if(c&&CATS.some(x=>x[0]==c))F.c=c;return `<div class="w sec"><h1>Shop</h1><div class="bar"><input id="fq" placeholder="Search products…" value="${esc(F.q)}"><select id="fc"><option value="">All categories</option>${CATS.map(c=>`<option value="${c[0]}" ${F.c==c[0]?'selected':''}>${c[1]}</option>`).join('')}</select><select id="fp"><option value="">Any price</option>${[500,1000,2500,5000].map(n=>`<option value="${n}" ${F.p==n?'selected':''}>Under ${inr(n)}</option>`).join('')}</select><select id="fs"><option value="">Sort: Popularity</option><option value="a" ${F.s=='a'?'selected':''}>Price: Low to High</option><option value="d" ${F.s=='d'?'selected':''}>Price: High to Low</option></select></div><div class="grid" id="pg"></div></div>`}
function shopInit(){const u=()=>{F={q:$('#fq').value,c:$('#fc').value,p:$('#fp').value,s:$('#fs').value};let l=products.filter(p=>p.active!==false&&(!F.c||p.cat==F.c)&&(!F.p||p.price<=+F.p)&&(!F.q||(p.name+' '+p.desc).toLowerCase().includes(F.q.toLowerCase())));l.sort((a,b)=>F.s=='a'?a.price-b.price:F.s=='d'?b.price-a.price:b.pop-a.pop);$('#pg').innerHTML=l.length?l.map(card).join(''):'<p class="mut">No products found.</p>'};['fq','fc','fp','fs'].forEach(i=>$('#'+i).oninput=u);u()}
function prod(id){const p=P(id);if(!p)return '<div class="w sec"><p>Product not found. <a href="#shop">Back to shop</a></p></div>';return `<div class="w sec"><a href="#shop">← Back to shop</a><div class="two" style="margin-top:14px"><div class="big" style="${bg(p)}">${esc(p.icon||'📦')}</div><div><h1>${esc(p.name)}</h1><div class="mut">${esc(cn(p.cat))}</div><div class="pr" style="margin:10px 0"><b style="font-size:28px">${inr(p.price)}</b>${disc(p)?`<s>${inr(p.mrp)}</s> <b class="ok">${disc(p)}% off</b>`:''}</div><p>${esc(p.desc)}</p><p>${p.stock>0?`<b class="ok">In stock</b> <span class="mut">(${p.stock>10?'available':'only '+p.stock+' left'})</span>`:'<b class="er">Out of stock</b>'}</p>${p.sample?'<div class="note">This is a placeholder product.</div>':''}<div class="bar"><button class="btn" ${p.stock>0?'':'disabled'} onclick="add('${esc(p.id)}')">Add to Cart</button><button class="btn k" ${p.stock>0?'':'disabled'} onclick="add('${esc(p.id)}',1)">Buy Now</button></div></div></div></div>`}
function cartV(){const it=items();if(!it.length)return '<div class="w sec"><h1>Your Cart</h1><p>Your cart is empty.</p><a class="btn" href="#shop">Continue shopping</a></div>';return `<div class="w sec"><h1>Your Cart</h1>${it.map(x=>`<div class="row"><div style="font-size:36px">${esc(x.p.icon)}</div><div class="t"><b>${esc(x.p.name)}</b><div class="mut">${inr(x.p.price)} each</div></div><div class="q"><button onclick="qty('${esc(x.p.id)}',-1)">−</button><span>${x.q}</span><button onclick="qty('${esc(x.p.id)}',1)">+</button></div><b style="min-width:70px;text-align:right">${inr(x.p.price*x.q)}</b><button class="btn s g" onclick="rm('${esc(x.p.id)}')">✕</button></div>`).join('')}<div class="tot"><span>Total</span><span>${inr(total())}</span></div><p class="mut">Delivery charges, if any, are confirmed when your order is accepted.</p><a class="btn" href="#checkout">Proceed to Checkout</a></div>`}
function checkout(){const it=items();if(!it.length)return cartV();return `<div class="w sec"><h1>Checkout</h1><div class="two"><form id="cf"><label>Full name</label><input name="name" required maxlength="80"><label>Mobile number</label><input name="phone" required inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" placeholder="10-digit Indian mobile number"><label>Delivery address</label><textarea name="addr" rows="3" required maxlength="300"></textarea><label>PIN code</label><input name="pin" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6"><label>Payment</label><div class="box"><label style="margin:0"><input type="radio" checked style="width:auto"> Cash on Delivery</label><div class="mut">Online payment is not available because no payment gateway is connected.</div></div>${uid?'':'<div class="note">Please sign in (top right) before placing your order.</div>'}<p id="em" class="er"></p><button class="btn" style="width:100%" id="pb">Place Order (Cash on Delivery)</button></form><div class="box"><h3>Order Summary</h3>${it.map(x=>`<div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(x.p.name)} × ${x.q}</span><span>${inr(x.p.price*x.q)}</span></div>`).join('')}<div class="tot"><span>Total</span><span>${inr(total())}</span></div></div></div></div>`}
async function placeOrder(e){e.preventDefault();const f=new FormData(e.target),it=items(),em=$('#em');
 if(!db){em.textContent='Order storage is not connected. Please order via WhatsApp or email from the Contact page.';return}
 if(!uid){em.textContent='Please sign in (top right) before placing your order.';return}
 $('#pb').disabled=true;const id='SI'+crypto.randomUUID().replace(/-/g,'').toUpperCase();
 const od={ownerId:uid,name:f.get('name').trim(),phone:f.get('phone'),address:f.get('addr').trim(),pin:f.get('pin'),items:it.map(x=>({id:x.p.id,name:x.p.name,price:x.p.price,qty:x.q})),total:0,payment:'Cash on Delivery',status:'New',createdAt:'__ts__'};
 od.total=od.items.reduce((a,i)=>a+i.price*i.qty,0);
 try{if(!vOrder({...od,id,created:new Date().toISOString()},uid))throw 0;await db.doc('orders/'+id).set(od);cart={};saveCart();location.hash='done-'+id}
 catch(x){em.textContent='Could not save your order. Please try again or contact us.';$('#pb').disabled=false}}
const done=id=>`<div class="w sec"><h1>Order request received ✔</h1><p>Your order reference is <b>${esc(id)}</b>. We will contact you on your mobile number to confirm. Payment: Cash on Delivery.</p><a class="btn" href="#shop">Continue shopping</a></div>`;
const ST=['New','Confirmed','Shipped','Delivered','Cancelled'];
function vOrder(o,owner){try{return !!o&&/^SI[0-9A-F]{32}$/.test(o.id)&&o.ownerId===owner&&typeof o.name=='string'&&/^[\p{L}\p{N} .,'-]{2,80}$/u.test(o.name.trim())&&/^[6-9]\d{9}$/.test(o.phone)&&typeof o.address=='string'&&o.address.trim().length>=5&&o.address.length<=300&&/^\d{6}$/.test(o.pin)&&Array.isArray(o.items)&&o.items.length>0&&o.items.length<=50&&o.items.every(i=>typeof i.id=='string'&&typeof i.name=='string'&&Number.isInteger(i.qty)&&i.qty>0&&i.qty<=100&&typeof i.price=='number'&&i.price>=0)&&o.total===o.items.reduce((a,i)=>a+i.price*i.qty,0)&&o.payment=='Cash on Delivery'&&ST.includes(o.status)&&!isNaN(Date.parse(o.created))}catch(e){return false}}
function myOrders(){setTimeout(loadMine,0);return '<div class="w sec"><h1>My Orders</h1><div id="mo" class="mut">Loading…</div></div>'}
async function loadMine(){const el=$('#mo');if(!el)return;if(!db||!uid){el.textContent='Please sign in (top right) to see your orders.';return}try{const sn=await db.collection('orders').where('ownerId','==',uid).get(),l=sn.docs.map(d=>({id:d.id,...d.data()})).filter(o=>vOrder(o,uid)).sort((a,b)=>b.created.localeCompare(a.created));el.innerHTML=l.length?l.map(o=>`<div class="box" style="margin-bottom:10px"><b>${esc(o.id)}</b> · ${esc(new Date(o.created).toLocaleDateString('en-IN'))}<ul>${o.items.map(i=>`<li>${esc(i.name)} × ${esc(i.qty)}</li>`).join('')}</ul><b>${inr(o.total)}</b> · Status: ${esc(o.status)}</div>`).join(''):'No orders yet.'}catch(e){el.textContent='Could not load your orders.'}}
function waLink(t){const n=(settings.whatsapp||'').replace(/\D/g,'');return n?`https://wa.me/${n}?text=${encodeURIComponent(t||'Hello SUDIP INDUSTRY')}`:''}
function contact(){const w=waLink();return `<div class="w sec"><h1>Contact Us</h1><div class="two"><div><p>Email: <a href="mailto:sudippramanick66@gmail.com">sudippramanick66@gmail.com</a></p>${w?`<a class="btn wa" href="${esc(w)}" target="_blank" rel="noopener">💬 Chat on WhatsApp</a>`:'<p class="mut">WhatsApp number not set yet. The owner can add it in Admin → Settings.</p>'}</div><form id="mf"><label>Name</label><input name="name" required maxlength="80"><label>Email or mobile</label><input name="contact" required maxlength="100"><label>Message</label><textarea name="msg" rows="4" required maxlength="1000"></textarea><p id="mm" class="mut"></p><button class="btn">Send Message</button></form></div></div>`}
async function sendMsg(e){e.preventDefault();const f=new FormData(e.target),m=$('#mm');const d={name:f.get('name').trim().slice(0,80),contact:f.get('contact').trim().slice(0,100),msg:f.get('msg').trim().slice(0,1000)};
 if(db&&uid){try{await db.doc('messages/M'+crypto.randomUUID().replace(/-/g,'')).set({...d,createdAt:'__ts__'});e.target.reset();m.textContent='Thank you! Your message has been sent.';return}catch(x){}}
 location.href='mailto:sudippramanick66@gmail.com?subject='+encodeURIComponent('Message from '+d.name)+'&body='+encodeURIComponent(d.msg+'\n\nContact: '+d.contact)}
const about=()=>`<div class="w sec"><h1>About SUDIP INDUSTRY</h1><div class="tag" style="color:var(--bl)">DREAM • WORK • SUCCESS</div><p>SUDIP INDUSTRY is an online shopping store serving customers across India. We believe in honest pricing, careful product selection and responsive customer service.</p><p>Our commitment is simple: offer products we are proud to sell, keep you informed about your order, and treat every customer with respect. We are just getting started and plan to grow our range across Electronics, Fashion, Home &amp; Kitchen, Beauty &amp; Personal Care and Accessories.</p><a class="btn" href="#contact">Get in touch</a></div>`;

function admin(){
 if(!db)return '<div class="w sec"><h1>Admin</h1><div class="note">Database not connected.</div></div>';
 if(!uid)return '<div class="w sec"><h1>Admin</h1><p>Please sign in first (top right).</p></div>';
 if(!isAdmin)return '<div class="w sec"><h1>Admin</h1><p>This account is not an admin.</p></div>';
 const tabs=['products','orders','messages','settings'];
 return `<div class="w sec"><h1>Admin Dashboard</h1><div class="tabs">${tabs.map(t=>`<button class="btn s ${aTab==t?'on':''}" onclick="aTab='${t}';route()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${aTab=='products'?aProd():aTab=='orders'?aOrd():aTab=='messages'?aMsg():aSet()}</div>`}
function aProd(){const e=P(editId)||{cat:'electronics',stock:10,pop:50,icon:'📦',hue:220};const L=(k,l,t)=>`<div><label>${l}</label><input id="e_${k}" type="${t||'text'}" value="${esc(e[k]!=null?e[k]:'')}"></div>`;
 return `${dbOn?'':`<div class="note">The database has no products yet — the site is showing placeholder samples. <button class="btn s" onclick="seed()">Save placeholders to database</button> or add your own below.</div>`}
<div class="box"><h3>${editId?'Edit product':'Add product'}</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${L('name','Name')}<div><label>Category</label><select id="e_cat">${CATS.map(c=>`<option value="${c[0]}" ${e.cat==c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div>${L('price','Price ₹','number')}${L('mrp','MRP ₹ (for discount)','number')}${L('stock','Stock','number')}${L('pop','Popularity 0-100','number')}${L('icon','Emoji icon')}${L('hue','Colour hue 0-360','number')}</div><label>Description</label><textarea id="e_desc" rows="3">${esc(e.desc||'')}</textarea><label><input type="checkbox" id="e_act" style="width:auto" ${e.active===false?'':'checked'}> Visible in store</label><br><button class="btn" onclick="saveP()">Save</button> ${editId?'<button class="btn g" onclick="editId=null;route()">Cancel</button>':''}</div>
<div class="sc"><table>${products.map(p=>`<tr class="row"><td>${esc(p.icon)} <b>${esc(p.name)}</b>${p.sample?' <span class="mut">(sample)</span>':''}<div class="mut">${inr(p.price)} · stock ${p.stock}${p.active===false?' · hidden':''}</div></td><td style="text-align:right;white-space:nowrap">${p.sample?'':`<button class="btn s g" onclick="editId='${esc(p.id)}';route()">Edit</button> <button class="btn s r" onclick="delP('${esc(p.id)}')">Delete</button>`}</td></tr>`).join('')}</table></div>`}
const gv=k=>$('#e_'+k).value;
async function saveP(){if(!gv('name').trim()){toast('Name required');return}const d={name:gv('name').trim(),cat:gv('cat'),price:+gv('price')||0,mrp:+gv('mrp')||0,stock:Math.max(0,+gv('stock')||0),pop:+gv('pop')||0,icon:gv('icon')||'📦',hue:+gv('hue')||220,desc:gv('desc'),active:$('#e_act').checked};
 try{await db.doc('products/'+(editId||'P'+Date.now().toString(36))).set(d);editId=null;toast('Saved')}catch(e){toast('Save failed')}}
async function delP(id){if(confirm('Delete this product?'))try{await db.doc('products/'+id).delete()}catch(e){toast('Failed')}}
async function seed(){try{for(const p of SEED){const{id,sample,...d}=p;await db.doc('products/'+id).set(d)}toast('Saved')}catch(e){toast('Failed')}}
const chk=o=>vOrder(o,o.ownerId)&&o.items.every(i=>{const p=P(i.id);return !p||p.price===i.price});
function aOrd(){if(!orders.length)return '<p>No orders yet.</p>';return orders.slice().sort((a,b)=>(b.created||'').localeCompare(a.created||'')).map(o=>{const ok=chk(o);return `<div class="box" style="margin-bottom:12px"><b>${esc(o.id)}</b> · ${esc(new Date(o.created).toLocaleString('en-IN'))}${ok?'':' <b class="er">⚠ FAILED CHECK – do not fulfil</b>'}<br>${esc(o.name)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br>${esc(o.address)}, ${esc(o.pin)}<ul>${(o.items||[]).map(i=>`<li>${esc(i.name)} × ${esc(i.qty)} @ ${inr(i.price)}</li>`).join('')}</ul><b>${inr(o.total)}</b> · ${esc(o.payment)}<br><label>Status</label><select ${ok?'':'disabled'} onchange="setSt('${esc(o.id)}',this.value)">${ST.map(s=>`<option ${o.status==s?'selected':''}>${s}</option>`).join('')}</select></div>`}).join('')}
async function setSt(id,st){const o=orders.find(x=>x.id==id);if(!o||!chk(o))return;try{if(st=='Confirmed'&&!o.stockAdjusted){for(const i of o.items){const p=P(i.id);if(p&&!p.sample)await db.doc('products/'+i.id).update({stock:Math.max(0,p.stock-i.qty)})}await db.doc('orders/'+id).update({status:st,stockAdjusted:true})}else await db.doc('orders/'+id).update({status:st});toast('Updated')}catch(e){toast('Failed')}}
const aMsg=()=>msgs.length?msgs.map(m=>`<div class="box" style="margin-bottom:10px"><b>${esc(m.name)}</b> · ${esc(m.contact)}<br>${esc(m.msg)}<div class="mut">${esc(m.created)}</div></div>`).join(''):'<p>No messages yet.</p>';
const aSet=()=>`<div class="box"><label>WhatsApp number (with country code, e.g. 91XXXXXXXXXX)</label><input id="wa" value="${esc(settings.whatsapp)}"><br><br><button class="btn" onclick="saveSet()">Save</button></div>
<div class="note"><b>Setup status</b><br>Database: ${db?'<span class="ok">connected</span>':'not connected'}<br>Payment gateway: <span class="er">not connected</span> (Cash on Delivery only)<br>Order tracking: not implemented<br>Still to do: real products, WhatsApp number, policy review, business address (add only if you have one).</div>`;
async function saveSet(){try{await db.doc('settings/store').set({whatsapp:$('#wa').value.replace(/\D/g,'')});toast('Saved')}catch(e){toast('Failed')}}
/* ---------- INIT ---------- */
$('#mb').onclick=()=>$('#nl').classList.toggle('o');$('#yr').textContent=new Date().getFullYear();
addEventListener('hashchange',route);saveCart();route();
let unsubs=[];const q=()=>{if(location.hash.slice(1)=='admin')route()};
function subscribe(){unsubs.forEach(f=>f());unsubs=[];if(!db)return;const er=()=>{};
 unsubs.push(db.collection('products').onSnapshot(s=>{if(!s.empty){dbOn=true;products=s.docs.map(d=>({id:d.id,...d.data()}))}else{dbOn=false;products=SEED.slice()}route()},er));
 unsubs.push(db.doc('settings/store').onSnapshot(s=>{if(s.exists)settings={...settings,...s.data()}},er));
 if(isAdmin){unsubs.push(db.collection('orders').onSnapshot(s=>{orders=s.docs.map(d=>({id:d.id,...d.data()}));q()},er));unsubs.push(db.collection('messages').onSnapshot(s=>{msgs=s.docs.map(d=>d.data());q()},er))}}
function authUI(){const b=$('#lg');b.textContent=curUser?'Sign out':'Sign in';b.onclick=()=>curUser?FB.signOut():FB.signIn().catch(()=>toast('Sign-in failed'))}
function boot(){db=FB.db;FB.onAuth(async u=>{curUser=u;uid=u?u.uid:null;isAdmin=false;if(u){try{isAdmin=(await db.doc('admins/'+u.uid).get()).exists}catch(e){}}authUI();subscribe();route()})}
window.FB?boot():addEventListener('fbready',boot);
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,onSnapshot,query,where,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyANbPXxpxMNibsWpJ6fqb71fGOADbdMVzk",authDomain:"sudip-industry.firebaseapp.com",projectId:"sudip-industry",storageBucket:"sudip-industry.firebasestorage.app",messagingSenderId:"377224435101",appId:"1:377224435101:web:c5e152120dec1664070b74"});
const auth=getAuth(app),fdb=getFirestore(app);
const conv=d=>{if(!d)return d;const o={...d};if(o.createdAt&&o.createdAt.toDate)o.created=o.createdAt.toDate().toISOString();return o};
const wrap=s=>({id:s.id,exists:s.exists(),data:()=>conv(s.data())});
const wrapQ=s=>({docs:s.docs.map(wrap),empty:s.empty,size:s.size});
const prep=d=>{const o={...d};if(o.createdAt==='__ts__')o.createdAt=serverTimestamp();return o};
const dr=p=>doc(fdb,p);
window.FB={db:{
 doc:p=>({get:async()=>wrap(await getDoc(dr(p))),set:d=>setDoc(dr(p),prep(d)),update:d=>updateDoc(dr(p),d),delete:()=>deleteDoc(dr(p)),onSnapshot:(n,e)=>onSnapshot(dr(p),x=>n(wrap(x)),e)}),
 collection:c=>({onSnapshot:(n,e)=>onSnapshot(collection(fdb,c),x=>n(wrapQ(x)),e),where:(f,op,v)=>({get:async()=>wrapQ(await getDocs(query(collection(fdb,c),where(f,op,v))))})})},
 onAuth:cb=>onAuthStateChanged(auth,cb),signIn:()=>signInWithPopup(auth,new GoogleAuthProvider()),signOut:()=>signOut(auth)};
dispatchEvent(new Event('fbready'));
</script></body></html>
