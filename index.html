<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUDIP INDUSTRY</title>
<style>
:root{--blue:#1d4ed8;--bg:#f1f5fb;--text:#111827}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--blue);color:white;padding:18px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
header a{color:white;text-decoration:none;margin:5px}
main{max-width:1000px;margin:auto;padding:18px}
button,.btn{background:var(--blue);color:white;border:0;padding:11px 16px;border-radius:7px;cursor:pointer}
input,textarea,select{width:100%;padding:11px;margin:7px 0 14px;border:1px solid #ccd3df;border-radius:7px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px}
.card,.panel{background:white;padding:14px;border-radius:12px;box-shadow:0 2px 9px #0001}
.photo{height:170px;display:flex;align-items:center;justify-content:center;background:#eef2ff;border-radius:8px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain}
.price{font-weight:bold;font-size:19px;margin:10px 0}
.muted{color:#64748b;font-size:13px}
nav{display:flex;gap:12px;flex-wrap:wrap}
.hidden{display:none}
footer{text-align:center;padding:25px;color:#64748b}
</style>
</head>
<body>
<header>
<div><b>SUDIP INDUSTRY</b><br><small>DREAM • WORK • SUCCESS</small></div>
<nav>
<a href="#home">Home</a>
<a href="#shop">Shop</a>
<a href="#cart">Cart (<span id="count">0</span>)</a>
<a href="#admin">Admin</a>
</nav>
</header>

<main id="app"></main>
<footer>SUDIP INDUSTRY © 2026</footer>

<script>
const KEY='sudip_products_v1';
const CART='sudip_cart_v1';

let products=JSON.parse(localStorage.getItem(KEY)||'[]');
let cart=JSON.parse(localStorage.getItem(CART)||'[]');

function save(){
 localStorage.setItem(KEY,JSON.stringify(products));
 localStorage.setItem(CART,JSON.stringify(cart));
 updateCount();
}

function updateCount(){
 document.getElementById('count').textContent=
 cart.reduce((n,x)=>n+x.qty,0);
}

function money(n){
 return '₹'+Number(n||0).toLocaleString('en-IN');
}

function image(p){
 return p.image
 ? `<img src="${escapeHTML(p.image)}" alt="${escapeHTML(p.name)}">`
 : '📦';
}

function escapeHTML(s){
 return String(s||'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;',
 '"':'&quot;',"'":'&#39;'
 }[c]));
}

function home(){
 return `<section class="panel">
 <h1>Welcome to SUDIP INDUSTRY</h1>
 <p>Dream • Work • Success</p>
 <a class="btn" href="#shop">Explore Products</a>
 </section>`;
}

function shop(){
 return `<h2>Our Products</h2>
 <div class="grid">
 ${products.map(p=>`
 <article class="card">
 <div class="photo">${image(p)}</div>
 <h3>${escapeHTML(p.name)}</h3>
 <div class="price">${money(p.price)}</div>
 <button onclick="addCart('${p.id}')">Add to Cart</button>
 </article>`).join('')}
 </div>
 ${products.length?'':'<p>No products available.</p>'}`;
}

function addCart(id){
 const p=products.find(x=>x.id===id);
 if(!p)return;
 const item=cart.find(x=>x.id===id);
 if(item)item.qty++;
 else cart.push({id,qty:1});
 save();
 alert('Added to cart');
}

function cartPage(){
 return `<h2>Your Cart</h2>
 ${cart.map(x=>{
 const p=products.find(y=>y.id===x.id);
 if(!p)return '';
 return `<div class="panel">
 <b>${escapeHTML(p.name)}</b>
 <p>${money(p.price)} × ${x.qty}</p>
 <button onclick="changeQty('${x.id}',-1)">−</button>
 <button onclick="changeQty('${x.id}',1)">+</button>
 </div>`;
 }).join('')}
 <h3>Total: ${money(cart.reduce((n,x)=>{
 const p=products.find(y=>y.id===x.id);
 return n+(p?p.price*x.qty:0);
 },0))}</h3>`;
}

function changeQty(id,n){
 const x=cart.find(y=>y.id===id);
 if(!x)return;
 x.qty+=n;
 if(x.qty<=0)cart=cart.filter(y=>y.id!==id);
 save();route();
}

function admin(){
 return `<section class="panel">
 <h2>Add Product</h2>
 <label>Product Name</label>
 <input id="name" placeholder="Product name">
 <label>Category</label>
 <input id="cat" placeholder="Category">
 <label>Price ₹</label>
 <input id="price" type="number">
 <label>MRP ₹</label>
 <input id="mrp" type="number">
 <label>Stock</label>
 <input id="stock" type="number">
 <label>Product Image URL</label>
 <input id="image" type="url" placeholder="Paste image URL">
 <label>Description</label>
 <textarea id="desc"></textarea>
 <button onclick="addProduct()">Save Product</button>
 </section>
 <h2>Manage Products</h2>
 <div class="grid">
 ${products.map(p=>`<div class="card">
 <div class="photo">${image(p)}</div>
 <b>${escapeHTML(p.name)}</b>
 <p>${money(p.price)}</p>
 <button onclick="deleteProduct('${p.id}')">Delete</button>
 </div>`).join('')}
 </div>`;
}

function addProduct(){
 const name=document.getElementById('name').value.trim();
 const price=Number(document.getElementById('price').value);
 if(!name||price<=0){alert('Enter product name and valid price');return}
 products.push({
 id:'SI'+Date.now(),
 name,
 cat:document.getElementById('cat').value,
 price,
 mrp:Number(document.getElementById('mrp').value),
 stock:Number(document.getElementById('stock').value),
 image:document.getElementById('image').value.trim(),
 desc:document.getElementById('desc').value
 });
 save();route();alert('Product saved');
}

function deleteProduct(id){
 if(!confirm('Delete this product?'))return;
 products=products.filter(p=>p.id!==id);
 save();route();
}

function route(){
 const page=location.hash.slice(1)||'home';
 const app=document.getElementById('app');
 if(page==='home')app.innerHTML=home();
 else if(page==='shop')app.innerHTML=shop();
 else if(page==='cart')app.innerHTML=cartPage();
 else if(page==='admin')app.innerHTML=admin();
 else app.innerHTML=home();
 updateCount();
}

window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
