
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b75">
<title>SUDIP INDUSTRY</title>
<style>
:root{--blue:#173b75;--gold:#f4b942;--bg:#f3f6fb;--line:#e3e8f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#172033;font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
header{background:var(--blue);color:white;position:sticky;top:0;z-index:10}
.top{max-width:1150px;margin:auto;padding:12px;display:flex;align-items:center;gap:10px}
.logo{font-size:17px;font-weight:bold;color:white;text-decoration:none}
.logo small{display:block;font-size:9px;letter-spacing:2px}
.search{flex:1;display:flex;background:white;border-radius:8px;overflow:hidden}
.search input{width:100%;padding:11px;border:0}
.search button{background:var(--gold);padding:10px}
.headbtn{background:#ffffff20;color:white;padding:10px;border-radius:7px}
nav{display:flex;gap:8px;padding:0 12px 10px;overflow:auto}
nav button{background:transparent;color:white;padding:8px}
main{max-width:1150px;margin:20px auto;padding:0 15px 90px;min-height:55vh}
.hero{background:linear-gradient(120deg,#10264b,#2863b3);color:white;padding:30px;border-radius:15px}
.hero h1{font-size:30px}
.section{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.card,.panel{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.product-img{height:180px;background:#f7f8fb;display:grid;place-items:center;position:relative}
.product-img img{width:100%;height:100%;object-fit:contain}
.heart{position:absolute;right:8px;top:8px;background:white;border-radius:50%;padding:8px;color:red}
.info{padding:11px}
.info h3{font-size:14px;min-height:34px}
.price{font-size:18px;font-weight:bold;color:var(--blue)}
.actions{display:flex;gap:6px;margin-top:10px}
.actions button{flex:1;padding:9px 4px;border-radius:7px;font-size:12px}
.primary{background:var(--blue);color:white;padding:11px 15px;border-radius:8px}
.soft{background:#edf2fa;color:var(--blue);padding:9px 12px;border-radius:7px}
.gold{background:var(--gold);padding:11px 16px;border-radius:8px}
.danger{background:#fff0f1;color:#c33345;padding:8px;border-radius:7px}
.panel{padding:17px;margin-bottom:15px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field input,.field textarea,.field select{padding:11px;border:1px solid #dce2ec;border-radius:8px;width:100%}
.field textarea{min-height:75px}
.gallery{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}
.gallery img{width:100%;height:75px;object-fit:contain;background:#f3f6fb;border:1px solid var(--line);border-radius:7px;cursor:pointer}
.main-photo{width:100%;height:280px;object-fit:contain;background:#f7f8fb}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{font-size:13px;color:#69758a}
.empty{text-align:center;padding:25px;color:#69758a}
.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item img{width:65px;height:65px;object-fit:contain}
.grow{flex:1}
.qty{display:flex;gap:8px;align-items:center;margin-top:7px}
.qty button{padding:5px 10px;background:#edf2fa}
.paybox{background:#f3f6fb;padding:14px;border-radius:9px;margin:10px 0}
footer{background:#10264b;color:white;text-align:center;padding:25px}
footer a{color:white}
.bottom{display:none}
.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:12px;border-radius:8px;z-index:30}
.hidden{display:none!important}
@media(max-width:800px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){
.top{flex-wrap:wrap}.logo{flex:1}.search{order:3;flex-basis:100%}
.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.product-img{height:140px}.form{grid-template-columns:1fr}
.field.full{grid-column:auto}
.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;justify-content:space-around;padding:10px 2px;z-index:15}
.bottom button{background:none;font-size:11px}
}
</style>
</head>
<body>
<header>
 <div class="top">
  <a class="logo" href="#home">SUDIP INDUSTRY<small>DREAM • WORK • SUCCESS</small></a>
  <div class="search">
   <input id="search" placeholder="Search products..." oninput="searchProducts(this.value)">
   <button onclick="searchProducts(document.getElementById('search').value)">Search</button>
  </div>
  <button class="headbtn" onclick="go('wishlist')">❤️ <span id="wc">0</span></button>
  <button class="headbtn" onclick="go('cart')">🛒 <span id="cc">0</span></button>
  <button class="headbtn" onclick="go('profile')" id="accountBtn">Login</button>
 </div>
 <nav>
  <button onclick="go('home')">Home</button>
  <button onclick="go('shop')">Shop</button>
  <button onclick="go('orders')">My Orders</button>
  <button onclick="go('contact')">Contact</button>
  <button onclick="go('admin')">Admin</button>
 </nav>
</header>
<main id="app">Connecting to store...</main>
<div class="bottom">
 <button onclick="go('home')">⌂ Home</button>
 <button onclick="go('shop')">▦ Shop</button>
 <button onclick="go('wishlist')">♡ Wishlist</button>
 <button onclick="go('cart')">🛒 Cart</button>
 <button onclick="go('profile')">♙ Profile</button>
</div>
<footer>
 <b>SUDIP INDUSTRY</b><br>DREAM • WORK • SUCCESS<br><br>

 WhatsApp: <a href="https://wa.me/918981988831">+91 89819 88831</a><br><br>
 © 2026 SUDIP INDUSTRY
</footer>
<div id="toast" class="toast hidden"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import{getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signOut,signInAnonymously,linkWithPopup}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import{getFirestore,collection,addDoc,getDocs,doc,updateDoc,deleteDoc,setDoc,getDoc,query,where,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyANbPXxpxMNibsWpJ6fqb71fGOADbdMVzk",
 authDomain:"sudip-industry.firebaseapp.com",
 projectId:"sudip-industry",
 storageBucket:"sudip-industry.firebasestorage.app",
 messagingSenderId:"377224435101",
 appId:"1:377224435101:web:c5e152120dec1664070b74"
};
const ADMIN_EMAIL="sudippramanick66@gmail.com";
const fb=initializeApp(firebaseConfig);
const auth=getAuth(fb);
const db=getFirestore(fb);
const provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});

let user=null,products=[],orders=[],wishlist=[],paymentSettings={},cart=[];
let term="",category="All",selectedProduct="",busy=false;
try{cart=JSON.parse(localStorage.getItem("sudip_cart_v1")||"[]");if(!Array.isArray(cart))cart=[]}catch(e){cart=[]}

const $=s=>document.querySelector(s);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isAdmin=()=>!!user&&!user.isAnonymous&&user.email===ADMIN_EMAIL;
function toast(s){const e=$("#toast");e.textContent=s;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),3000)}
function go(p){location.hash=p}
window.go=go;
function counts(){
 $("#cc").textContent=cart.reduce((s,x)=>s+(Number(x.qty)||0),0);
 $("#wc").textContent=wishlist.length;
}
function saveCart(){localStorage.setItem("sudip_cart_v1",JSON.stringify(cart));counts()}
function updateAccount(){$("#accountBtn").textContent=user&&!user.isAnonymous?(user.displayName||"Account"):"Login"}

async function loadData(){
 const r=await getDocs(collection(db,"products"));
 products=r.docs.map(d=>({id:d.id,...d.data()}));
 const p=await getDoc(doc(db,"paymentSettings","main"));
 paymentSettings=p.exists()?p.data():{};
 wishlist=[];orders=[];
 if(user&&!user.isAnonymous){
  try{const w=await getDocs(collection(db,"users",user.uid,"wishlist"));wishlist=w.docs.map(d=>d.id)}catch(e){}
  try{
   const q=isAdmin()?collection(db,"orders"):query(collection(db,"orders"),where("ownerUid","==",user.uid));
   const o=await getDocs(q);
   orders=o.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){}
 }
 counts();updateAccount();render();
}

onAuthStateChanged(auth,async u=>{
 user=u;updateAccount();
 if(!u){try{await signInAnonymously(auth)}catch(e){$("#app").textContent="Authentication Error: "+e.message}}
 else{try{await loadData()}catch(e){$("#app").innerHTML="<div class='panel'>Firebase Error: "+safe(e.message)+"</div>"}}
});

async function googleLogin(){
 try{
  if(user?.isAnonymous){
   try{await linkWithPopup(user,provider)}
   catch(e){
    if(["auth/credential-already-in-use","auth/email-already-in-use"].includes(e.code)){
     await signOut(auth);await signInWithPopup(auth,provider)
    }else throw e
   }
  }else await signInWithPopup(auth,provider);
 }catch(e){toast("Login হয়নি: "+e.message)}
}
async function logout(){try{await signOut(auth);toast("Logout হয়েছে")}catch(e){toast(e.message)}}
async function switchAccount(){try{await signOut(auth);await signInWithPopup(auth,provider)}catch(e){toast(e.message)}}
window.googleLogin=googleLogin;window.logout=logout;window.switchAccount=switchAccount;

/* Product image helper: supports up to 5 images */
function productImages(p){
 let a=Array.isArray(p.images)?p.images:[];
 if(!a.length&&p.image)a=[p.image];
 return a.filter(x=>typeof x==="string"&&x.trim()).slice(0,5);
}
function card(p){
 const imgs=productImages(p);
 return `<div class="card">
  <div class="product-img">
   ${imgs[0]?`<img src="${safe(imgs[0])}" alt="${safe(p.name)}" onerror="this.style.display='none'">`:"🛍️"}
   <button class="heart" onclick="toggleWish('${safe(p.id)}')">${wishlist.includes(p.id)?"♥":"♡"}</button>
  </div>
  <div class="info">
   <h3>${safe(p.name)}</h3>
   <span class="price">${money(p.price)}</span>
   <p>${safe(p.category||"Other")}</p>
   <div class="actions">
    <button class="soft" onclick="showProduct('${safe(p.id)}')">Details</button>
    <button class="primary" onclick="addCart('${safe(p.id)}')">Add to Cart</button>
   </div>
  </div>
 </div>`;
}
function empty(s){return `<div class="empty">${safe(s)}</div>`}
function home(){
 return `<section class="hero"><h1>Welcome to SUDIP INDUSTRY</h1><p>Shop smart. Shop with confidence.</p><button class="gold" onclick="go('shop')">Explore Products →</button></section>
 <div class="section"><h2>Shop by Category</h2></div>
 <div class="row">${["All","Fashion","Electronics","Home","Beauty","Other"].map(c=>`<button class="soft" onclick="filterCategory('${c}')">${c}</button>`).join("")}</div>
 <div class="section"><h2>Featured Products</h2><button class="soft" onclick="go('shop')">View All</button></div>
 <div class="products">${products.slice(0,8).map(card).join("")||empty("এখনও Product যোগ করা হয়নি।")}</div>`;
}
function shop(){
 const list=products.filter(p=>(!term||(p.name||"").toLowerCase().includes(term)||(p.category||"").toLowerCase().includes(term))&&(category==="All"||p.category===category));
 return `<div class="section"><h2>All Products</h2><span>${list.length} Products</span></div><div class="products">${list.map(card).join("")||empty("কোনো Product পাওয়া যায়নি।")}</div>`;
}
window.filterCategory=c=>{category=c;go("shop")};
window.searchProducts=v=>{term=String(v||"").trim().toLowerCase();if(location.hash!=="#shop")go("shop");else render()};
window.showProduct=id=>{selectedProduct=id;go("product")};
window.addCart=id=>{const x=cart.find(a=>a.id===id);if(x)x.qty++;else cart.push({id,qty:1});saveCart();toast("Cart-এ যোগ হয়েছে")};
window.toggleWish=async id=>{
 if(!user||user.isAnonymous){toast("Wishlist-এর জন্য Google Login করো");go("profile");return}
 try{
  const ref=doc(db,"users",user.uid,"wishlist",id);
  if(wishlist.includes(id)){await deleteDoc(ref);wishlist=wishlist.filter(x=>x!==id)}
  else{await setDoc(ref,{createdAt:serverTimestamp()});wishlist.push(id)}
  counts();render();
 }catch(e){toast(e.message)}
};

/* Product details with clickable image gallery */
function productView(){
 const p=products.find(x=>x.id===selectedProduct);
 if(!p)return empty("Product পাওয়া যায়নি");
 const imgs=productImages(p);
 return `<div class="panel">
  <button class="soft" onclick="go('shop')">← Back</button>
  <div class="row" style="margin-top:15px;align-items:flex-start">
   <div style="flex:1;min-width:220px">
    ${imgs.length?`<img id="mainProductPhoto" class="main-photo" src="${safe(imgs[0])}">`:"<div class='main-photo'>🛍️</div>"}
    <div class="gallery">${imgs.map((src,i)=>`<img src="${safe(src)}" alt="Photo ${i+1}" onclick="changeProductPhoto('${safe(src)}')">`).join("")}</div>
   </div>
   <div style="flex:1;min-width:220px">
    <h2>${safe(p.name)}</h2><h2 class="price">${money(p.price)}</h2>
    <p>${safe(p.description||"")}</p><p>${safe(p.category||"")}</p>
    <button class="primary" onclick="addCart('${safe(p.id)}')">Add to Cart</button>
    <button class="soft" onclick="toggleWish('${safe(p.id)}')">♡ Wishlist</button>
   </div>
  </div>
 </div>`;
}
window.changeProductPhoto=src=>{const e=$("#mainProductPhoto");if(e)e.src=src};

function cartView(){
 const items=cart.map(x=>({...x,p:products.find(p=>p.id===x.id)})).filter(x=>x.p);
 const total=items.reduce((s,x)=>s+Number(x.p.price)*x.qty,0);
 return `<div class="section"><h2>Shopping Cart</h2></div>
 <div class="panel">
 ${items.map(x=>`<div class="item">
  <img src="${safe(productImages(x.p)[0]||"")}" alt="">
  <div class="grow"><h3>${safe(x.p.name)}</h3><b>${money(x.p.price)}</b>
   <div class="qty">
    <button onclick="changeQty('${safe(x.id)}',-1)">−</button>
    ${x.qty}
    <button onclick="changeQty('${safe(x.id)}',1)">+</button>
    <button class="danger" onclick="removeCart('${safe(x.id)}')">Remove</button>
   </div>
  </div>
 </div>`).join("")||empty("তোমার Cart খালি।")}
 ${items.length?`<div class="row"><b>Total: ${money(total)}</b><button class="primary" onclick="go('checkout')">Checkout</button></div>`:""}
 </div>`;
}
window.changeQty=(id,n)=>{
 const x=cart.find(a=>a.id===id);
 if(x){x.qty+=n;if(x.qty<1)cart=cart.filter(a=>a.id!==id);saveCart();render()}
};
window.removeCart=id=>{cart=cart.filter(x=>x.id!==id);saveCart();render()};

function paymentInstructions(){
 const method=$("#paymentMethod")?.value||"COD";
 const p=paymentSettings;
 if(method==="COD")return `<div class="paybox">Cash on Delivery। পণ্য হাতে পেয়ে টাকা দেবে।</div>`;
 if(method==="UPI")return `<div class="paybox"><b>UPI Payment</b><p>UPI ID: ${safe(p.upiId||"Not configured")}</p></div><div class="field"><label>UTR / Transaction ID</label><input name="utr" maxlength="40"></div>`;
 return `<div class="paybox"><b>Bank Transfer</b><p>Account Name: ${safe(p.accountName||"")}</p><p>Bank: ${safe(p.bankName||"")}</p><p>Account Number: ${safe(p.accountNumber||"")}</p><p>IFSC: ${safe(p.ifsc||"")}</p></div><div class="field"><label>UTR / Transaction ID</label><input name="utr" maxlength="40"></div>`;
}
window.updatePaymentInstructions=()=>{
 const e=$("#paymentInstructions");
 if(e)e.innerHTML=paymentInstructions();
};

function checkout(){
 const items=cart.map(x=>({...x,p:products.find(p=>p.id===x.id)})).filter(x=>x.p);
 const total=items.reduce((s,x)=>s+Number(x.p.price)*x.qty,0);
 if(!items.length)return empty("আগে Cart-এ Product যোগ করো।");
 if(!user||user.isAnonymous)return `<div class="panel"><h2>Google Login প্রয়োজন</h2><button class="primary" onclick="googleLogin()">Google Login</button></div>`;
 return `<div class="section"><h2>Checkout</h2></div>
 <div class="panel">
 <form class="form" onsubmit="placeOrder(event)">
  <div class="field"><label>Full Name *</label><input name="name" required maxlength="80"></div>
  <div class="field"><label>Mobile Number *</label><input name="phone" required pattern="[6-9][0-9]{9}" maxlength="10"></div>
  <div class="field full"><label>Delivery Address *</label><textarea name="address" required minlength="10"></textarea></div>
  <div class="field"><label>City / Town *</label><input name="city" required></div>
  <div class="field"><label>PIN Code *</label><input name="pin" required pattern="[0-9]{6}" maxlength="6"></div>
  <div class="field full"><label>Payment Method</label>
   <select name="paymentMethod" id="paymentMethod" onchange="updatePaymentInstructions()">
    <option value="COD">Cash on Delivery</option>
    ${paymentSettings.upiId?'<option value="UPI">UPI Payment</option>':""}
    ${paymentSettings.accountNumber?'<option value="BANK">Bank Transfer</option>':""}
   </select>
  </div>
  <div class="field full" id="paymentInstructions">${paymentInstructions()}</div>
  <div class="field full"><h3>Order Total: ${money(total)}</h3></div>
  <div class="field full"><button class="primary" type="submit">Place Order</button></div>
 </form></div>`;
}

async function placeOrder(event){
 event.preventDefault();
 if(busy)return;
 const form=event.currentTarget;
 if(!form.reportValidity())return;
 const data=new FormData(form);
 const items=cart.map(x=>({...x,p:products.find(p=>p.id===x.id)})).filter(x=>x.p);
 if(!items.length)return;
 const method=String(data.get("paymentMethod")||"COD");
 if(method==="UPI"&&!paymentSettings.upiId)return toast("UPI Details নেই");
 if(method==="BANK"&&!paymentSettings.accountNumber)return toast("Bank Details নেই");
 const total=items.reduce((s,x)=>s+Number(x.p.price)*x.qty,0);
 const order={
  ownerUid:user.uid,customerEmail:user.email||"",
  customerName:String(data.get("name")||"").trim(),
  phone:String(data.get("phone")||"").trim(),
  address:String(data.get("address")||"").trim(),
  city:String(data.get("city")||"").trim(),
  pin:String(data.get("pin")||"").trim(),
  paymentMethod:method,utr:String(data.get("utr")||"").trim(),
  items:items.map(x=>({productId:x.id,name:x.p.name,price:Number(x.p.price),qty:x.qty,image:productImages(x.p)[0]||""})),
  total,status:"Pending",
  paymentStatus:method==="COD"?"Pay on Delivery":"Payment Verification Pending",
  createdAt:serverTimestamp()
 };
 busy=true;
 const btn=form.querySelector('button[type="submit"]');
 btn.disabled=true;btn.textContent="Please wait...";
 try{
  await addDoc(collection(db,"orders"),order);
  cart=[];saveCart();await loadData();go("orders");toast("Order জমা হয়েছে");
 }catch(e){toast("Order হয়নি: "+e.message);btn.disabled=false;btn.textContent="Place Order"}
 finally{busy=false}
}
window.placeOrder=placeOrder;

function wishlistView(){
 const items=products.filter(p=>wishlist.includes(p.id));
 return `<div class="section"><h2>My Wishlist</h2></div><div class="products">${items.map(card).join("")||empty("Wishlist খালি।")}</div>`;
}
function profileView(){
 if(!user||user.isAnonymous)return `<div class="panel"><h2>My Account</h2><button class="primary" onclick="googleLogin()">Google Login</button></div>`;
 return `<div class="panel"><h2>My Account</h2><p>${safe(user.displayName||"Customer")}</p><p>${safe(user.email||"")}</p><button class="soft" onclick="switchAccount()">Switch Account</button> <button class="danger" onclick="logout()">Logout</button></div>`;
}
function ordersView(){
 if(!user||user.isAnonymous)return `<div class="panel"><p>Order দেখতে Google Login করো।</p><button class="primary" onclick="googleLogin()">Login</button></div>`;
 return `<div class="section"><h2>My Orders</h2></div>
 ${orders.map(o=>`<div class="panel"><h3>Order #${safe(o.id)}</h3><p>Total: ${money(o.total)}</p><p>Status: ${safe(o.status)}</p><p>Payment: ${safe(o.paymentStatus)}</p></div>`).join("")||empty("এখনও কোনো Order নেই।")}`;
}
function contactView(){
 return `<div class="panel"><h2>Contact SUDIP INDUSTRY</h2><p>Email: sudippramanick66@gmail.com</p><p>WhatsApp: +91 89819 88831</p><a href="https://wa.me/918981988831">Chat on WhatsApp</a></div>`;
}

/* Admin Dashboard: five image URL fields */
function adminView(){
 if(!isAdmin())return `<div class="panel"><h2>Admin Login Required</h2><button class="primary" onclick="googleLogin()">Google Login</button></div>`;
 return `<div class="section"><h2>Admin Dashboard</h2></div>
 <div class="panel">
  <h3>Add New Product</h3>
  <form class="form" onsubmit="submitProduct(event)">
   <div class="field full"><label>Product Name *</label><input name="name" required></div>
   <div class="field"><label>Price *</label><input name="price" type="number" min="1" required></div>
   <div class="field"><label>Category</label><input name="category"></div>
   <div class="field full"><label>Description</label><textarea name="description"></textarea></div>
   <div class="field full"><label>Image URL 1 *</label><input name="image1" type="url" required placeholder="First image URL"></div>
   <div class="field full"><label>Image URL 2</label><input name="image2" type="url" placeholder="Second image URL"></div>
   <div class="field full"><label>Image URL 3</label><input name="image3" type="url" placeholder="Third image URL"></div>
   <div class="field full"><label>Image URL 4</label><input name="image4" type="url" placeholder="Fourth image URL"></div>
   <div class="field full"><label>Image URL 5</label><input name="image5" type="url" placeholder="Fifth image URL"></div>
   <div class="field full"><button class="primary" type="submit">Add Product</button></div>
  </form>
 </div>
 <div class="panel">
  <h3>Payment Settings</h3>
  <form class="form" onsubmit="submitPaymentSettings(event)">
   <div class="field full"><label>UPI ID</label><input name="upiId" value="${safe(paymentSettings.upiId||"")}"></div>
   <div class="field"><label>Account Name</label><input name="accountName" value="${safe(paymentSettings.accountName||"")}"></div>
   <div class="field"><label>Bank Name</label><input name="bankName" value="${safe(paymentSettings.bankName||"")}"></div>
   <div class="field"><label>Account Number</label><input name="accountNumber" value="${safe(paymentSettings.accountNumber||"")}"></div>
   <div class="field"><label>IFSC</label><input name="ifsc" value="${safe(paymentSettings.ifsc||"")}"></div>
   <div class="field full"><button class="primary">Save Payment Settings</button></div>
  </form>
 </div>
 <div class="panel"><h3>Manage Products</h3>
 ${products.map(p=>`<div class="item"><div class="grow"><b>${safe(p.name)}</b><br>${money(p.price)}<br><small>${productImages(p).length} images</small></div><button class="danger" onclick="deleteProduct('${safe(p.id)}')">Delete</button></div>`).join("")||empty("No products")}
 </div>
 <div class="panel"><h3>Manage Orders</h3>
 ${orders.map(o=>`<div class="item"><div class="grow"><b>${safe(o.customerName||"Customer")}</b><br>${safe(o.phone||"")}<br>${money(o.total)}<br>${safe(o.status||"Pending")}</div><select onchange="updateOrderStatus('${safe(o.id)}',this.value)"><option>${safe(o.status||"Pending")}</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select></div>`).join("")||empty("No orders")}
 </div>`;
}

async function submitProduct(event){
 event.preventDefault();
 if(!isAdmin())return;
 const data=new FormData(event.currentTarget);
 const images=[1,2,3,4,5].map(i=>String(data.get("image"+i)||"").trim()).filter(Boolean);
 const product={
  name:String(data.get("name")||"").trim(),
  price:Number(data.get("price")),
  category:String(data.get("category")||"").trim(),
  description:String(data.get("description")||"").trim(),
  images,
  image:images[0]||"",
  createdAt:serverTimestamp()
 };
 if(!product.name||!Number.isFinite(product.price)||product.price<=0)return toast("Product Details ঠিক করো");
 try{
  await addDoc(collection(db,"products"),product);
  event.currentTarget.reset();await loadData();go("admin");toast("Product Added");
 }catch(e){toast("Error: "+e.message)}
}
window.submitProduct=submitProduct;

async function submitPaymentSettings(event){
 event.preventDefault();
 if(!isAdmin())return;
 const d=new FormData(event.currentTarget);
 const settings={
  upiId:String(d.get("upiId")||"").trim(),
  accountName:String(d.get("accountName")||"").trim(),
  bankName:String(d.get("bankName")||"").trim(),
  accountNumber:String(d.get("accountNumber")||"").trim(),
  ifsc:String(d.get("ifsc")||"").trim()
 };
 try{await setDoc(doc(db,"paymentSettings","main"),settings);paymentSettings=settings;toast("Payment Settings Saved");render()}
 catch(e){toast(e.message)}
}
window.submitPaymentSettings=submitPaymentSettings;

async function deleteProduct(id){
 if(!isAdmin()||!confirm("Product Delete করবে?"))return;
 try{await deleteDoc(doc(db,"products",id));await loadData();toast("Product Deleted")}
 catch(e){toast(e.message)}
}
window.deleteProduct=deleteProduct;

async function updateOrderStatus(id,status){
 if(!isAdmin())return;
 try{await updateDoc(doc(db,"orders",id),{status});await loadData();toast("Order Updated")}
 catch(e){toast(e.message)}
}
window.updateOrderStatus=updateOrderStatus;

function render(){
 const page=(location.hash||"#home").slice(1);
 let html="";
 if(page==="home")html=home();
 else if(page==="shop")html=shop();
 else if(page==="product")html=productView();
 else if(page==="cart")html=cartView();
 else if(page==="checkout")html=checkout();
 else if(page==="wishlist")html=wishlistView();
 else if(page==="profile")html=profileView();
 else if(page==="orders")html=ordersView();
 else if(page==="contact")html=contactView();
 else if(page==="admin")html=adminView();
 else html=home();
 $("#app").innerHTML=html;
}
window.render=render;
window.addEventListener("hashchange",render);
counts();
render();
</script>
</body>
</html>
